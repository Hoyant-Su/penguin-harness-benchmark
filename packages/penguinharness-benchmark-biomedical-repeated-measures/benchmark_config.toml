id = "penguinharness-benchmark-biomedical-repeated-measures"
title = "Biomedical prediction across patients and recordings"
description = "Two biomedical prediction tasks using the UCI Parkinsons (doi:10.24432/C59C74) and Parkinsons Telemonitoring (doi:10.24432/C5ZS3N) datasets. They assess generalization across patients, predictor eligibility and patient-level evaluation. Each task receives 100 points when all numerical checks pass and the required analysis and interpretation files are present, and 0 otherwise. Scientific interpretation is reviewed separately."
